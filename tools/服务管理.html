<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务管理</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --text: #222222;
      --text-2: #666666;
      --text-3: #999999;
      --border: #e5e5e5;
      --row-hover: #f5f5f6;
      --btn-primary-bg: #222222;
      --success: #27a243;
      --danger: #c0392b;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
      padding: 20px 24px 40px;
    }
    .page { max-width: 1180px; margin: 0 auto; }
    header.page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    header.page-head h1 {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 600;
    }
    header.page-head .subtitle { color: var(--text-2); font-size: 13px; }
    .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 12px; font-size: 13px; color: var(--text-2);
    }
    .toolbar select {
      padding: 6px 8px; font-size: 13px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .toolbar label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    #registry-path {
      font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .status { color: var(--text-2); font-size: 13px; padding: 8px 2px; min-height: 20px; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--success); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #f8f8f8; font-weight: 600; color: var(--text-2); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--row-hover); }
    td.mono, .mono { font-family: Consolas, "Courier New", ui-monospace, monospace; font-size: 12px; }
    .svc-name { font-weight: 600; }
    .svc-type { color: var(--text-3); font-size: 12px; margin-top: 2px; }
    td.wrap { max-width: 260px; word-break: break-all; color: var(--text-2); font-size: 12px; }
    a.link { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    a.link:hover { color: #000; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .dot.run { background: var(--success); }
    .dot.stopped { background: var(--text-3); }
    .dot.healthy { box-shadow: 0 0 0 2px rgba(39,162,67,.25); }
    .dot.unhealthy { background: var(--danger); box-shadow: 0 0 0 2px rgba(192,57,43,.2); }
    .tag {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      font-size: 12px; border: 1px solid var(--border); color: var(--text-2); background: #fafafa;
    }
    .tag.run { color: var(--success); border-color: rgba(39,162,67,.4); background: #f2faf4; }

    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; font-size: 12px; cursor: pointer;
      color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      text-decoration: none; white-space: nowrap;
    }
    .btn:hover { background: var(--row-hover); border-color: #d9d9d9; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { color: #fff; background: var(--btn-primary-bg); border-color: var(--btn-primary-bg); }
    .btn.primary:hover { background: #000; }
    .btn.danger { color: var(--danger); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .empty-tip { text-align: center; color: var(--text-3); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <h1>
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1" y="2" width="14" height="5" rx="1" fill="currentColor"></rect>
          <rect x="1" y="9" width="14" height="5" rx="1" fill="currentColor" opacity="0.4"></rect>
        </svg>
        服务管理
      </h1>
      <span class="subtitle">管理 agent 通过 jrun 启动的 Java 服务</span>
      <span class="head-actions">
        <label><input type="checkbox" id="auto-refresh" checked> 10s 自动刷新</label>
        <button id="btn-refresh" type="button" class="btn primary">刷新</button>
      </span>
    </header>

    <div class="toolbar">
      <label>启动用 JDK
        <select id="jdk">
          <option value="jdk8">jdk8</option>
          <option value="jdk11">jdk11</option>
          <option value="jdk17">jdk17</option>
          <option value="jdk21">jdk21</option>
        </select>
      </label>
      <span id="registry-path" title=""></span>
    </div>

    <div id="status" class="status">正在加载服务列表…</div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>状态</th><th>服务</th><th>PID</th><th>端口</th><th>Profile</th>
            <th>启动时间</th><th>URL</th><th>日志文件</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty-tip" hidden>注册表中没有服务记录。</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let timer = null;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function fmtTime(t) {
      if (!t) return '—';
      return esc(t.replace('T', ' '));
    }

    function setStatus(msg, cls) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }

    function actionBtn(label, cls, fn, disabled, title) {
      return `<button type="button" class="btn ${cls || ''}" data-act="${fn}" ${disabled ? 'disabled' : ''} ${title ? `title="${esc(title)}"` : ''}>${label}</button>`;
    }

    function render(services) {
      const tbody = $('rows');
      $('empty').hidden = services.length > 0;
      tbody.innerHTML = services.map(s => {
        const running = !!s.alive;
        const healthDot = running
          ? (s.healthy ? '<span class="dot run healthy" title="URL 可访问"></span>' : '<span class="dot run unhealthy" title="URL 不可访问"></span>')
          : '<span class="dot stopped"></span>';
        const statusTag = running
          ? `<span class="tag run">运行中</span>`
          : `<span class="tag">已停止</span>`;
        const canStart = !running && s.jarPath && !s.remoteMode;
        const startTitle = canStart ? '' : (running ? '进程仍在运行'
          : (s.remoteMode ? 'docker/远程部署无法操作宿主机进程，请在本机工具站操作'
            : '注册表无 jarPath（exploded war 等请用 jrun 技能启动）'));
        return `<tr>
          <td>${healthDot}${statusTag}</td>
          <td><div class="svc-name">${esc(s.name)}</div><div class="svc-type">${esc(s.type || '')}</div></td>
          <td class="mono">${esc(s.pid || '—')}</td>
          <td class="mono">${esc(s.port || '—')}</td>
          <td class="wrap">${esc(s.profile || '—')}</td>
          <td class="mono">${fmtTime(s.startTime)}</td>
          <td class="wrap">${s.url ? `<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>` : '—'}</td>
          <td class="wrap mono" title="${esc(s.logFile || '')}">${esc(s.logFile || '—')}</td>
          <td><div class="row-actions">
            ${running
              ? actionBtn('停止', 'danger', 'stop')
              : actionBtn('启动', 'primary', 'start', !canStart, startTitle)}
          </div></td>
        </tr>`;
      }).join('');
    }

    async function load() {
      try {
        const data = await api('/api/services');
        $('registry-path').textContent = data.registryPath || '';
        $('registry-path').title = data.registryPath || '';
        render(data.services || []);
        setStatus('共 ' + (data.services || []).length + ' 个服务，上次刷新 ' + new Date().toLocaleTimeString());
      } catch (err) {
        setStatus('加载失败：' + err.message, 'err');
      }
    }

    async function doAction(name, action) {
      const verb = { stop: '停止', start: '启动' }[action];
      if (verb && !confirm(`确定${verb}服务 "${name}" 吗？`)) return;
      setStatus(`${verb} ${name} 中…`);
      try {
        const body = { name, action };
        if (action === 'start') body.javaHome = $('jdk').value;
        const data = await api('/api/services/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        setStatus(data.message || '操作成功', 'ok');
      } catch (err) {
        setStatus(`${verb}失败：` + err.message, 'err');
      }
      await load();
    }

    $('rows').addEventListener('click', e => {
      const btn = e.target.closest('button[data-act]');
      if (!btn || btn.disabled) return;
      const name = btn.closest('tr').querySelector('.svc-name').textContent;
      doAction(name, btn.dataset.act);
    });

    $('btn-refresh').addEventListener('click', load);
    $('auto-refresh').addEventListener('change', e => {
      clearInterval(timer);
      if (e.target.checked) timer = setInterval(load, 10000);
    });

    $('jdk').value = localStorage.getItem('svc-jdk') || 'jdk8';
    $('jdk').addEventListener('change', e => localStorage.setItem('svc-jdk', e.target.value));

    load();
    timer = setInterval(load, 10000);
  </script>
</body>
</html>
