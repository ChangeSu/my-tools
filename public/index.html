<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具导航</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header">
    <h1>工具导航</h1>
    <p class="subtitle">个人小工具集合</p>
  </header>
  <main>
    <div id="toolbar" class="toolbar">
      <input id="search" type="search" placeholder="搜索工具（名称或分类）…" autocomplete="off">
    </div>
    <div id="status" class="status">正在加载工具列表…</div>
    <div id="groups"></div>
    <div id="empty" class="status" hidden>没有匹配的工具。</div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
